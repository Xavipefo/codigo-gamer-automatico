name: Píxel Feroz - Produccion completa (Short / Largo)

on:
  workflow_call:
    inputs:
      formato:
        description: "Formato solicitado por el botón de Shorts o Largos"
        type: string
        required: true
      tema:
        description: "ID opcional; vacío equivale al siguiente de la lista"
        type: string
        required: false
        default: ""
      subir_privado:
        type: boolean
        required: true
      confirmacion:
        type: string
        required: true
      motor_tts:
        description: "Motor de voz; qwen activa Ryan local sin API TTS"
        type: string
        required: false
        default: qwen
      exigir_multimedia:
        description: "Bloquear producción de largos sin fotos y clips autorizados"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: pixel-feroz-produccion
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HF_HOME: ${{ github.workspace }}/.hf-qwen
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Comprobar autorizacion de subida
        env:
          SUBIR: ${{ inputs.subir_privado }}
          CONFIRMACION: ${{ inputs.confirmacion }}
          REPO_PRIVADO: ${{ github.event.repository.private }}
        shell: bash
        run: |
          if [ "$SUBIR" = "true" ] && [ "$CONFIRMACION" != "SUBIR_PRIVADO" ]; then
            echo "::error::Debe escribir SUBIR_PRIVADO para permitir subida privada."
            exit 1
          fi
          if [ "$REPO_PRIVADO" = "false" ] && [ "$SUBIR" != "true" ]; then
            echo "::error::En repositorios públicos no se almacenan MP4 privados en artifacts. Selecciona subida privada a YouTube o ejecuta en un repositorio privado."
            exit 1
          fi

      - name: Comprobar clave para guion largo con IA
        if: ${{ inputs.formato == 'largo' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Falta GEMINI_API_KEY en los Secrets del repositorio. Los vídeos largos necesitan IA para escribir el guion."
            exit 1
          fi

      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar sistema multimedia
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Comprobar fuentes y Python
        # Los tests antiguos de Gemini/Azure verifican sus propias voces.
        # El paso de PRODUCCIÓN volverá a usar PF_TTS_PROVIDER=qwen.
        # Los tests Qwen activan el proveedor local dentro de su contexto.
        env:
          PF_TTS_PROVIDER: ""
        run: |
          python -m py_compile *.py
          python -m unittest discover -s . -p 'test_*.py'

      - name: Bloquear largo sin banco visual cuando se exige calidad multimedia
        if: ${{ inputs.formato == 'largo' && inputs.exigir_multimedia }}
        env:
          TEMA: ${{ inputs.tema }}
          PF_CLIPS_JSON: ${{ secrets.PF_CLIPS_JSON }}
          PF_IMAGENES_JSON: ${{ secrets.PF_IMAGENES_JSON }}
        run: python validar_banco_visual.py --tema "$TEMA"

      # La galería oficial se descarga y valida antes de cargar el modelo TTS.
      # No se almacena material de Rockstar en el repositorio Git.
      - name: Restaurar banco oficial GTA VI desde caché
        uses: actions/cache@v4
        with:
          path: .cache/rockstar
          key: pixel-feroz-gta6-rockstar-screenshots-20261118-v2

      - name: Descargar, verificar y clasificar capturas oficiales de GTA VI
        run: |
          python rockstar_media.py --preparar
          python rockstar_extras.py --preparar
          python rockstar_media.py --revision

      # Los clips oficiales son opcionales. Si el ZIP está temporalmente
      # inaccesible, se usan capturas reales con cortes cada siete segundos.
      - name: Restaurar clips oficiales GTA VI
        if: ${{ inputs.formato == 'largo' }}
        uses: actions/cache@v4
        with:
          path: .cache/rockstar_clips
          key: pixel-feroz-gta6-clips-oficiales-20261118-v1

      - name: Preparar clips oficiales para largos (sin bloqueo si fallan)
        if: ${{ inputs.formato == 'largo' }}
        shell: bash
        run: |
          if python rockstar_clips.py --preparar; then
            echo "Banco de clips oficiales disponible."
          else
            echo "::warning::No se pudieron preparar los clips oficiales; el largo se montará con capturas verificadas."
          fi

      - name: Confirmar Gemini TTS para narración española
        if: ${{ inputs.motor_tts != 'qwen' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Necesitas GEMINI_API_KEY para la voz natural Achird/Charon."
            exit 1
          fi
          echo "La clave de Gemini está disponible sin exponerla."

      - name: Elegir y preparar tema verificado
        env:
          PF_CLIPS_JSON: ${{ secrets.PF_CLIPS_JSON }}
          PF_IMAGENES_JSON: ${{ secrets.PF_IMAGENES_JSON }}
          PF_TTS_PROVIDER: ${{ inputs.motor_tts == 'qwen' && 'qwen' || 'gemini' }}
          TEMA: ${{ inputs.tema }}
          FORMATO: ${{ inputs.formato }}
        shell: bash
        run: |
          if [ -n "$TEMA" ]; then
            python editorial.py --formato "$FORMATO" --tema "$TEMA"
          else
            python editorial.py --formato "$FORMATO"
          fi

      - name: Preparar guion narrado con IA si hay clave
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORMATO: ${{ inputs.formato }}
        run: python generar_guion_ia.py --formato "$FORMATO"

      - name: Restaurar pesos públicos de Qwen3-TTS Ryan
        if: ${{ inputs.motor_tts == 'qwen' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub
          key: pixel-feroz-qwen3tts-${{ runner.os }}-ligero-12hz-v1

      - name: Instalar narrador local Qwen3-TTS (CPU, sin API)
        if: ${{ inputs.motor_tts == 'qwen' }}
        run: |
          sudo apt-get install -y sox libsox-fmt-all libsndfile1
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install --no-cache-dir "qwen-tts==0.1.1" --no-deps
          python -m pip install --no-cache-dir \
            "transformers==4.57.3" "accelerate==1.12.0" \
            librosa soundfile sox onnxruntime einops huggingface_hub

      - name: Generar narración en español, gráficos y MP4
        env:
          PF_ROCKSTAR_MEDIA: "1"
          PF_ROCKSTAR_CLIPS: ${{ inputs.formato == 'largo' && '1' || '0' }}
          PF_TTS_PROVIDER: ${{ inputs.motor_tts == 'qwen' && 'qwen' || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          PF_CLIPS_JSON: ${{ secrets.PF_CLIPS_JSON }}
          PF_IMAGENES_JSON: ${{ secrets.PF_IMAGENES_JSON }}
        shell: bash
        run: |
          # Solo reanudar ante HTTP 429 temporal. Los códigos de error
          # ordinarios (incluyendo fallos de vídeo y privacidad) no se
          # reintentan ni se ocultan. Nunca se reintenta el upload.
          set +e
          for intento in 1 2 3; do
            echo "Generación audiovisual, intento $intento/3"
            python motor_video.py
            estado=$?
            if [ "$estado" -eq 0 ]; then
              echo "Generación terminada y lista para control de calidad."
              exit 0
            fi
            if [ "$estado" -eq 78 ]; then
              echo "::error::Gemini indicó una cuota diaria agotada. Consulta AI Studio."
              exit 1
            fi
            if [ "$estado" -ne 75 ]; then
              echo "::error::Fallo de producción distinto de HTTP 429. No se reinicia."
              exit "$estado"
            fi
            if [ "$intento" -eq 3 ]; then
              echo "::error::La cuota TTS sigue bloqueada después de tres ventanas de recuperación."
              exit 1
            fi
            espera=$((180 * intento))
            echo "::warning::Cuota temporal Gemini agotada; se reanudará en $espera segundos con los archivos ya creados en este runner."
            sleep "$espera"
          done
          exit 1

      - name: Control tecnico de calidad
        env:
          PF_TTS_PROVIDER: ${{ inputs.motor_tts == 'qwen' && 'qwen' || 'gemini' }}
          PF_ROCKSTAR_MEDIA: "1"
          FORMATO: ${{ inputs.formato }}
        run: python control_calidad.py --formato "$FORMATO"

      - name: PF-43 - Detectar vídeo negro, congelado o sin narración
        env:
          FORMATO: ${{ inputs.formato }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FORMATO" = "short" ]; then
            archivo="salida/pixel_feroz_short.mp4"
            orientacion="vertical"
            minimo=10
            maximo=180
          else
            archivo="salida/pixel_feroz_largo.mp4"
            orientacion="horizontal"
            minimo=180
            maximo=1200
          fi
          python auditoria_audiovisual.py --video "$archivo" \
            --orientacion "$orientacion" --minimo "$minimo" \
            --maximo "$maximo" --informe salida/auditoria_audiovisual.json

      - name: PF-49 - Revisar regiones del manifiesto antes de YouTube
        run: python auditoria_visual_pf49.py

      # Solo previews e imágenes oficiales seleccionadas; nunca MP4 privado.
      # El artefacto sirve para analizar la composición como en Dato Nebular.
      - name: Descargar revisión visual de Short o largo
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel-feroz-${{ inputs.formato }}-imagenes-y-mosaico-${{ github.run_id }}
          path: salida/revision_visual/
          retention-days: 14
          if-no-files-found: warn

      - name: Preparar tres títulos y miniaturas A/B para vídeo largo
        if: ${{ inputs.formato == 'largo' }}
        run: python experimentos_portadas.py

      # El repositorio es PÚBLICO: estas portadas se generan solo con hechos
      # oficiales que ya están en temas_verificados.json. NUNCA exportar aquí
      # guion, vídeos, imágenes de juego no publicadas o credenciales.
      - name: Descargar paquete de propuestas A/B de vídeo largo
        if: ${{ inputs.formato == 'largo' }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel-feroz-ab-largo-${{ github.run_id }}
          path: salida/experimento/
          retention-days: 7
          if-no-files-found: error

      - name: Guardar video y revision editorial
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel-feroz-${{ inputs.formato }}-revision
          path: |
            salida/*.mp4
            salida/miniatura.jpg
            salida/guion.txt
            salida/descripcion.txt
            salida/plan.json
            salida/calidad.json
            salida/informe_ritmo_pf41.json
          retention-days: 7
          if-no-files-found: error

      - name: Subir exclusivamente PRIVADO a YouTube
        if: ${{ inputs.subir_privado }}
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          FORMATO: ${{ inputs.formato }}
          PF_SUBIR_PRIVADO: "SI"
        shell: bash
        run: python subir_youtube_privado.py --formato "$FORMATO"

      - name: Registrar subida verificada
        if: ${{ inputs.subir_privado }}
        shell: bash
        run: |
          # La subida ya ha ocurrido: NO volver a subir el MP4 si GitHub cambia.
          # Fusionar el resultado con el historial más reciente antes de escribir.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B registro-subida-privada FETCH_HEAD
            python registrar_subida.py
            git add historial_publicados.json colas/shorts.json colas/documentales.json
            if git diff --cached --quiet; then
              echo "El vídeo ya está registrado; no se sube otra vez."
              exit 0
            fi
            git commit -m "chore: registrar subida privada de Píxel Feroz"
            if git push origin HEAD:main; then
              echo "Historial actualizado sin perder otras subidas."
              exit 0
            fi
            echo "::warning::Otra ejecución actualizó main; reintentando registrar sin resubir."
            sleep 2
          done
          echo "::error::Vídeo YA SUBIDO en privado; no repetir producción. Registrar manualmente la URL del resultado."
          exit 1

      - name: Confirmar miniatura personalizada antes de dar exito
        if: ${{ inputs.subir_privado }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dato = json.loads(Path("salida/youtube_resultado.json").read_text(encoding="utf-8"))
          if dato.get("miniatura_confirmada") is not True:
              raise SystemExit(
                  "Vídeo privado registrado, pero miniatura pendiente. "
                  "NO volver a subir el MP4: revisar vídeo " + dato["video_id"]
              )
          print("Vídeo privado con miniatura personalizada confirmado.")
          PY

      - name: Guardar resultado de YouTube
        if: ${{ inputs.subir_privado && always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: pixel-feroz-resultado-subida
          path: salida/youtube_resultado.json
          if-no-files-found: ignore
          retention-days: 7
