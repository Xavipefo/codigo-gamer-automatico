name: "Píxel Feroz - 2. Crear vídeo largo privado"

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "ID opcional (en blanco = siguiente largo de temas_verificados.json)"
        type: string
        required: false
        default: ""
      exigir_material_real:
        description: "Opcional: bloquear si faltan imágenes y clips licenciados"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  crear-largo:
    uses: ./.github/workflows/produccion_completa.yml
    with:
      formato: largo
      tema: ${{ inputs.tema }}
      subir_privado: true
      confirmacion: SUBIR_PRIVADO
      motor_tts: qwen
      exigir_multimedia: ${{ inputs.exigir_material_real }}
    secrets: inherit
