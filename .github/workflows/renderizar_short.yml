name: Codigo Gamer - Renderizar Short privado local

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema a producir (vacio = primero)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codigo-gamer-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow==11.3.0 piper-tts==1.3.0

      - name: Comprobar programa y fuentes
        run: |
          python -m py_compile preparar_contenido.py generar_short.py
          python -m unittest discover -s . -p 'test_*.py'

      - name: Preparar guion
        env:
          TEMA: ${{ inputs.tema }}
        run: |
          if [ -n "$TEMA" ]; then
            python preparar_contenido.py --tema "$TEMA"
          else
            python preparar_contenido.py
          fi

      - name: Generar MP4 con voz y tarjetas originales
        run: python generar_short.py

      - name: Comprobar salida audiovisual
        run: |
          test -s salida/codigo_gamer_short.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 salida/codigo_gamer_short.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 salida/codigo_gamer_short.mp4

      - name: Guardar video y borradores para revision
        uses: actions/upload-artifact@v4
        with:
          name: codigo-gamer-short-para-revision
          path: |
            salida/codigo_gamer_short.mp4
            salida/narracion.wav
            salida/guion.txt
            salida/descripcion.txt
            salida/plan.json
          retention-days: 7
          if-no-files-found: error
