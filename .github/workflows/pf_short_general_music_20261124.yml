name: "PF - Segundo Short general 24 noviembre - Only Raw Records (privado)"

# Lanzamiento puntual por primera creación de este archivo. No se repite
# automáticamente ni publica el vídeo a los espectadores.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pf_short_general_music_20261124.yml"

permissions:
  contents: write

concurrency:
  group: pf-short-general-only-raw-20261124
  cancel-in-progress: false

jobs:
  short-general-musica:
    name: "Short general - Only Raw Records (privado)"
    uses: ./.github/workflows/produccion_completa.yml
    with:
      formato: short
      linea_editorial: general
      tema: gta6-only-raw-records
      subir_privado: true
      confirmacion: SUBIR_PRIVADO
      motor_tts: qwen
      exigir_multimedia: false
    secrets: inherit
