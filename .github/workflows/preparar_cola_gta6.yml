name: "Píxel Feroz - 0. Preparar cola y portadas GTA VI (sin subir)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "calendario_publicacion.json"
      - "ideas_postlanzamiento.json"
      - "temas_verificados.json"
      - "planificar_lanzamiento.py"
      - ".github/workflows/preparar_cola_gta6.yml"

permissions:
  contents: read

concurrency:
  group: pixel-feroz-preparacion-editorial
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python ligero
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow, sin descargar ningún modelo de voz
        run: python -m pip install "Pillow==11.3.0"
      - name: Crear agenda, borradores verificados y portadas originales
        run: python planificar_lanzamiento.py
      # ¡ATENCIÓN! Repo público: estos borradores con fuentes oficiales
      # y portadas genéricas también son accesibles a visitantes del repo.
      # Nunca almacenar ni exportar archivos confidenciales, vídeos o
      # grabaciones de gameplay no publicadas en esta acción.
      - name: Descargar paquete editorial de GTA VI
        uses: actions/upload-artifact@v4
        with:
          name: pixel-feroz-agenda-gta6-${{ github.run_id }}
          path: salida/lanzamiento/
          retention-days: 5
          if-no-files-found: error
