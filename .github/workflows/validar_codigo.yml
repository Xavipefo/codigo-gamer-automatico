name: "Píxel Feroz - Validar código (sin subir)"

on:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "*.json"
      - "descripcion_general.txt"
      - ".github/workflows/*.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "*.json"
      - "descripcion_general.txt"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cada cambio cancela la validación redundante anterior de la misma rama.
# Reduce minutos consumidos al editar varios archivos seguidos.
concurrency:
  group: pixel-feroz-validacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg y fuentes solo si faltan
        shell: bash
        run: |
          set -euo pipefail
          paquetes=()
          command -v ffmpeg >/dev/null 2>&1 || paquetes+=(ffmpeg)
          command -v ffprobe >/dev/null 2>&1 || paquetes+=(ffmpeg)
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || paquetes+=(fonts-dejavu-core)
          if [ "${#paquetes[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${paquetes[@]}"
          else
            echo "FFmpeg y fuentes disponibles; se omite apt-get."
          fi
      - name: Dependencias de tests sin descargar voz
        run: |
          python -m pip install --disable-pip-version-check \
            "Pillow==11.3.0" \
            "numpy>=1.26,<3" \
            "soundfile>=0.13,<1" \
            "google-api-python-client>=2.140,<3" \
            "google-auth>=2.35,<3" \
            "google-auth-oauthlib>=1.2,<2"
      - name: Compilar código Python
        run: python -m py_compile *.py
      - name: Ejecutar tests unitarios sin llamar a YouTube
        run: python -m unittest discover -s . -p "test_*.py" -v
