name: "Píxel Feroz - 1. Crear Short privado"

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "ID opcional (en blanco = siguiente Short de la cola seleccionada)"
        type: string
        required: false
        default: ""
      linea_editorial:
        description: "Shorts generales o episodio diario de la Historia GTA VI"
        type: choice
        required: true
        options:
          - general
          - historia
        default: general

permissions:
  contents: write

jobs:
  crear-short:
    uses: ./.github/workflows/produccion_completa.yml
    with:
      formato: short
      tema: ${{ inputs.tema }}
      linea_editorial: ${{ inputs.linea_editorial }}
      subir_privado: true
      confirmacion: SUBIR_PRIVADO
      motor_tts: qwen
    secrets: inherit
